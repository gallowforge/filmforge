name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: docs, links and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Docs check (links, anchors, images, visuals, templates, budgets, hygiene)
        run: python scripts/check_docs.py

      - name: Compile every Python file
        run: git ls-files -z '*.py' | xargs -0 -r python -m py_compile

      - name: Check shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.17.2 "**/*.md"

      - name: External link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config lychee.toml './**/*.md'
          fail: true

  tools:
    name: tools, tests and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the tools' dependencies (no GPU libraries)
        run: python -m pip install -r requirements.txt pytest

      - name: Every tool answers --help
        run: for t in tools/*.py; do [ "$(basename "$t")" = forgekit.py ] || python "$t" --help > /dev/null; done

      - name: Tests (pytest)
        run: python -m pytest -q tests

      - name: Tests without pytest (plain runner)
        run: python tests/run_tests.py

      - name: Installer, into a throwaway home folder
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          ./install.sh
          test "$(find "$HOME/.claude/skills" -mindepth 1 -maxdepth 1 -name 'forge-*' -type d | wc -l)" -eq 9
          python "$HOME/.claude/skills/forge-director/scripts/budget.py" tests/fixtures/finish_plan.yaml --credits 70.71 --retake 0
          ./install.sh --uninstall
          test -z "$(ls -A "$HOME/.claude/skills")"
